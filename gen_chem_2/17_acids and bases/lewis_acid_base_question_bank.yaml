      Which of the following species can be classified as a Lewis base?
    choices:
      A: '$\mathrm{BF_3}$'
      B: '$\mathrm{NH_3}$'
      C: '$\mathrm{Ag^+}$'
      D: '$\mathrm{AlCl_3}$'
    distractors:
      A: '$\mathrm{BF_3}$' # BF3 is a Lewis acid because its electron-deficient boron atom can accept an electron pair.
      C: '$\mathrm{Ag^+}$' # Ag+ is a Lewis acid because it can accept an electron pair from a ligand.
      D: '$\mathrm{AlCl_3}$' # AlCl3 is a Lewis acid because its aluminum center can accept an electron pair.
    correct_answer_choice: B
