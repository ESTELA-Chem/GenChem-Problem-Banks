title: Qualitative Effect of pH on Solubility
date_created: '2026-10-26'
learning_objective: Determine the effect of pH on solubility qualitatively.
author: Julie Donnelly
notation: Chemical formulas and ionic charges use Unicode subscripts and superscripts. Decreasing pH increases the solubility of a sparingly soluble
  salt when its anion is protonated; common ions decrease solubility.
question_count: 20
questions:
- id: pHSolubility-01
  question_stem: Which ionic compound becomes more soluble as the pH of the solution decreases?
  choices:
    A: AgCl
    B: PbBr₂
    C: CaF₂
    D: CuI
  distractors:
    A: Cl⁻ is not appreciably protonated as pH decreases.
    B: Br⁻ is not appreciably protonated as pH decreases.
    D: I⁻ is not appreciably protonated as pH decreases.
  correct_answer_choice: C
