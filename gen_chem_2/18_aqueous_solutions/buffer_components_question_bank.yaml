      B: '0.15 M $\mathrm{HNO_3}$ and 0.15 M $\mathrm{HCOONa}$'
      C: '0.15 M $\mathrm{HCOOH}$ and 0.0015 M $\mathrm{HCOONa}$'
      D: '0.15 M $\mathrm{HCOOH}$ and 0.15 M $\mathrm{HCOONa}$'
    distractors:
      A: '0.15 M $\mathrm{HCOOH}$ and 0.15 M $\mathrm{NaNO_3}$' # $\mathrm{NO_3^-}$ is not the conjugate base of $\mathrm{HCOOH}$.
      B: '0.15 M $\mathrm{HNO_3}$ and 0.15 M $\mathrm{HCOONa}$' # $\mathrm{HNO_3}$ is a strong acid and is not the conjugate acid of HCOO^-.
      C: '0.15 M $\mathrm{HCOOH}$ and 0.0015 M $\mathrm{HCOONa}$' # The conjugate pair is present, but the 100:1 concentration ratio is outside the usual effective buffer range.
    correct_answer_choice: D
  - id: BufferComponents-04
    question_stem: |-
      Which mixture will form an effective buffer solution?
    choices:
