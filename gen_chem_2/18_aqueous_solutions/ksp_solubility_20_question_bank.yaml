title: Solubility and Solubility Product Comparisons
date_created: '2026-10-26'
learning_objective: Relate the solubility of an ionic compound to its solubility product.
author: Julie Donnelly
notation: Solubility product constants are written as K<sub>sp</sub>. Molar solubility is represented by s, and chemical formulas use Unicode subscripts
  and superscripts.
question_count: 20
questions:
- id: KspSolubility-01
  question_stem: 'The K<sub>sp</sub> values for three ionic compounds at 25 °C are given below.


    - AgCl: 1.77 × 10⁻¹⁰

    - AgBr: 5.35 × 10⁻¹³

    - AgI: 8.52 × 10⁻¹⁷


    Rank the compounds in order of increasing molar solubility in pure water.'
  choices:
    A: AgCl < AgBr < AgI
    B: AgI < AgBr < AgCl
    C: AgBr < AgI < AgCl
    D: AgI < AgCl < AgBr
  distractors:
    A: Reverses the relationship between K<sub>sp</sub> and molar solubility for salts with the same stoichiometry.
    C: Places AgBr below AgI even though AgBr has the larger K<sub>sp</sub>.
    D: Places AgCl below AgBr even though AgCl has the larger K<sub>sp</sub>.
  correct_answer_choice: B
- id: KspSolubility-02
  question_stem: 'The K<sub>sp</sub> values for three ionic compounds at 25 °C are given below.


    - CdS: 8.0 × 10⁻²⁷

    - AgI: 8.52 × 10⁻¹⁷

    - CuI: 1.27 × 10⁻¹²


    Rank the compounds in order of increasing molar solubility in pure water.'
  choices:
    A: CdS < AgI < CuI
    B: CuI < AgI < CdS
    C: AgI < CdS < CuI
    D: CdS < CuI < AgI
  distractors:
    B: Reverses the correct solubility order.
    C: Places AgI below CdS even though CdS has the smaller K<sub>sp</sub>.
    D: Places CuI below AgI even though CuI has the larger K<sub>sp</sub>.
  correct_answer_choice: A
