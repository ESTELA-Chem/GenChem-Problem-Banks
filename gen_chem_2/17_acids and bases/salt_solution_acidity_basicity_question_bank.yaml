  - id: SaltAcidity-01
    question_stem: |-
      Which of the following salts forms an acidic aqueous solution?
    choices:
      A: '$\mathrm{NaCl}$'
      B: '$\mathrm{NH_4Cl}$'
      C: '$\mathrm{NaF}$'
      D: '$\mathrm{KNO_3}$'
    distractors:
      A: '$\mathrm{NaCl}$' # Neither $\mathrm{Na^+}$ nor $\mathrm{Cl^-}$ appreciably hydrolyzes, so the solution is approximately neutral.
