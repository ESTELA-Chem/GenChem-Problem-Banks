title: "Acidity and Basicity of Aqueous Salt Solutions"
date_created: "2026-10-26"
learning_objective: "Determine the overall acidity or basicity of salt solutions."
author: "Julie Donnelly"
notation: "Assume dilute aqueous solutions under introductory-chemistry conditions. A salt solution is classified by whether an ion appreciably hydrolyzes to produce $\\mathrm{H_3O^+}$ or $\\mathrm{OH^-}$; solutions containing only spectator ions are approximately neutral."
question_count: 25
questions:
  - id: SaltBasicity-01
    question_stem: |-
      Which of the following salts forms a basic aqueous solution?
    choices:
      A: '$\mathrm{NH_4Cl}$'
      B: '$\mathrm{NaCl}$'
      C: '$\mathrm{NaF}$'
      D: '$\mathrm{KNO_3}$'
    distractors:
      A: '$\mathrm{NH_4Cl}$' # $\mathrm{NH_4^+}$ is the conjugate acid of the weak base $\mathrm{NH_3}$ and produces $\mathrm{H_3O^+}$; $\mathrm{Cl^-}$ is a spectator.
      B: '$\mathrm{NaCl}$' # Neither $\mathrm{Na^+}$ nor $\mathrm{Cl^-}$ appreciably hydrolyzes, so the solution is approximately neutral.
      D: '$\mathrm{KNO_3}$' # Neither $\mathrm{K^+}$ nor $\mathrm{NO_3^-}$ appreciably hydrolyzes, so the solution is approximately neutral.
    correct_answer_choice: C
  - id: SaltBasicity-02
