- id: pHSolubility-11
  question_stem: A saturated solution is in equilibrium with solid CaF₂. Which change will increase the solubility of CaF₂?
  choices:
    A: Add CaCl₂.
    B: Increase the pH.
    C: Decrease the pH.
    D: Add NaF.
  distractors:
    A: Ca²⁺ is a common ion and decreases the solubility of CaF₂.
    B: Increasing the pH does not protonate or remove F⁻.
    D: F⁻ is a common ion and decreases the solubility of CaF₂.
  correct_answer_choice: C
