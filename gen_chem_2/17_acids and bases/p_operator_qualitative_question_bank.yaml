title: "Qualitative Comparison of pH and Hydronium-Ion Concentration"
date_created: "2026-10-26"
learning_objective: "Quantify acidity and basicity using the p operator."
author: "Julie Donnelly"
notation: "The pH is defined as $\\mathrm{pH} = -\\log[\\mathrm{H_3O^+}]$. Therefore, pH decreases as hydronium-ion concentration increases."
question_count: 12
questions:
  - id: pOperator-01
    question_stem: |-
      Which solution has the highest hydronium-ion concentration, $[\mathrm{H_3O^+}]$, as indicated by its pH?
    choices:
      A: 'A solution with pH = 2.5'
      B: 'A solution with pH = 5.0'
      C: 'A solution with pH = 7.0'
      D: 'A solution with pH = 9.5'
    distractors:
      B: 'A solution with pH = 5.0' # Its pH is higher than 2.5, so its hydronium-ion concentration is lower.
      C: 'A solution with pH = 7.0' # Its pH is higher than 2.5 and 5.0, so its hydronium-ion concentration is lower than in those solutions.
      D: 'A solution with pH = 9.5' # It has the highest pH listed, so it has the lowest hydronium-ion concentration.
    correct_answer_choice: A
