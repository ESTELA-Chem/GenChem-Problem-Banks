title: Buffer Solution pH Calculations
date_created: '2026-10-26'
learning_objective: Calculate the pH of a solution containing a weak acid or base and its conjugate partner using the appropriate
  acid-base equilibrium relationship.
author: Julie Donnelly
notation: Students are provided with Kₐ or K_b values rather than pK values. Questions do not explicitly identify the solution
  as a buffer. HTML subscript markup is used for K constants so subscripts are preserved during QTI export.
question_count: 20
questions:
- id: Buffer-01
  question_stem: A solution contains 0.120 M CH₃COOH and 0.300 M CH₃COONa. The K<sub>a</sub> for acetic acid is 1.8 × 10⁻⁵.
    What is the pH of the solution?
  choices:
    A: '4.34'
    B: '4.74'
    C: '5.14'
    D: '2.96'
  distractors:
    A: This answer results from reversing the conjugate-base-to-acid concentration ratio.
    B: This answer assumes pH = pKₐ even though the conjugate base and weak acid concentrations are unequal.
    D: This answer treats CH₃COOH as an isolated weak acid and ignores CH₃COO⁻.
  correct_answer_choice: C
