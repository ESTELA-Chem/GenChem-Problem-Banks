title: Final pH After Addition of Strong Acid or Base to a Buffer
date_created: '2026-10-26'
learning_objective: Calculate the final pH of a buffer solution after the addition of a small amount of strong acid or strong base.
author: Julie Donnelly
notation: Acid and base dissociation constants use portable HTML subscripts, such as K<sub>a</sub> and K<sub>b</sub>. Chemical formulas and ionic
  charges use Unicode subscripts and superscripts. Assume 25 °C and pK<sub>w</sub> = 14.00 for questions involving K<sub>b</sub>.
question_count: 15
questions:
- id: BufferChange-01
  question_stem: A 0.750 L solution contains 0.160 M HF and 0.240 M NaF. The K<sub>a</sub> for HF is 6.8 × 10⁻⁴. After 0.0300 mol HCl is added,
    what is the final pH? Assume the change in solution volume is negligible.
  choices:
    A: '3.09'
    B: '3.17'
    C: '3.34'
    D: '3.55'
  distractors:
    A: Subtracts the added H⁺ from F⁻ but does not increase the amount of HF produced.
    C: Uses the original F⁻-to-HF ratio and therefore calculates the initial pH.
    D: Treats HCl as if it converts HF into F⁻, reversing the neutralization reaction.
  correct_answer_choice: B
- id: BufferChange-02
  question_stem: A 1.00 L solution contains 0.200 M CH₃COOH and 0.300 M CH₃COONa. The K<sub>a</sub> for acetic acid is 1.8 × 10⁻⁵. After 0.0500
    mol HCl is added, what is the final pH? Assume the change in solution volume is negligible.
  choices:
    A: '4.84'
    B: '5.11'
    C: '4.74'
    D: '4.92'
  distractors:
    A: Subtracts the added H⁺ from CH₃COO⁻ but does not increase the amount of CH₃COOH produced.
    B: Treats HCl as if it converts CH₃COOH into CH₃COO⁻, reversing the neutralization reaction.
    D: Uses the original CH₃COO⁻-to-CH₃COOH ratio and therefore calculates the initial pH.
  correct_answer_choice: C
