title: "Using Kw to Relate Hydronium and Hydroxide Concentrations"
date_created: "2026-10-26"
learning_objective: "Perform calculations using Kw to relate hydronium ion and hydroxide ion concentrations in aqueous solutions."
author: "Julie Donnelly"
notation: "At 25 degrees C, $K_w = [\\mathrm{H_3O^+}][\\mathrm{OH^-}] = 1.0 \\times 10^{-14}$. Concentrations are reported in molarity (M)."
question_count: 15
questions:
  - id: KwConcentration-01
    question_stem: |-
      If the concentration of $[\mathrm{OH^-}]$ in a solution is $6.3 \times 10^{-6}\ \mathrm{M}$, what is the concentration of $[\mathrm{H_3O^+}]$?
    choices:
      A: '$6.3 \times 10^{-6}\ \mathrm{M}$'
      B: '$1.6 \times 10^{-9}\ \mathrm{M}$'
      C: '$1.6 \times 10^{-8}\ \mathrm{M}$'
      D: '$6.3 \times 10^{-20}\ \mathrm{M}$'
    distractors:
      A: '$6.3 \times 10^{-6}\ \mathrm{M}$' # Incorrectly assumes the hydronium-ion and hydroxide-ion concentrations are equal.
      C: '$1.6 \times 10^{-8}\ \mathrm{M}$' # Uses the correct inverse relationship but makes a one-place exponent error.
      D: '$6.3 \times 10^{-20}\ \mathrm{M}$' # Multiplies the given concentration by $K_w$ instead of dividing $K_w$ by the given concentration.
    correct_answer_choice: B
