title: "Identifying Components of Effective Buffers"
date_created: "2026-10-26"
learning_objective: "Define and identify the components of a buffer, including a conjugate acid-base pair present at comparable concentrations."
author: "Julie Donnelly"
notation: "An effective buffer contains appreciable amounts of a weak acid and its conjugate base, or a weak base and its conjugate acid. The conjugate partners differ by one proton and are present at comparable concentrations."
question_count: 15
questions:
  - id: BufferComponents-01
    question_stem: |-
      Which mixture will form an effective buffer solution?
    choices:
      A: '0.10 M $\mathrm{HCl}$ and 0.10 M $\mathrm{NaCl}$'
      B: '0.10 M $\mathrm{CH_3COOH}$ and 0.10 M $\mathrm{CH_3COONa}$'
      C: '0.10 M $\mathrm{CH_3COOH}$ and 0.10 M $\mathrm{NaCl}$'
      D: '0.0010 M $\mathrm{CH_3COOH}$ and 0.10 M $\mathrm{CH_3COONa}$'
    distractors:
      A: '0.10 M $\mathrm{HCl}$ and 0.10 M $\mathrm{NaCl}$' # $\mathrm{HCl}$ is a strong acid, and $\mathrm{Cl^-}$ is an ineffective conjugate base.
      C: '0.10 M $\mathrm{CH_3COOH}$ and 0.10 M $\mathrm{NaCl}$' # $\mathrm{Cl^-}$ is not the conjugate base of $\mathrm{CH_3COOH}$.
      D: '0.0010 M $\mathrm{CH_3COOH}$ and 0.10 M $\mathrm{CH_3COONa}$' # The conjugate pair is present, but the 100:1 concentration ratio is outside the usual effective buffer range and gives strongly unbalanced capacity.
    correct_answer_choice: B
  - id: BufferComponents-02
    question_stem: |-
      Which mixture will form an effective buffer solution?
    choices:
      A: '0.20 M $\mathrm{NH_3}$ and 0.20 M $\mathrm{NH_4Cl}$'
      B: '0.20 M $\mathrm{NaOH}$ and 0.20 M $\mathrm{NH_4Cl}$'
      C: '0.20 M $\mathrm{NH_3}$ and 0.20 M $\mathrm{NaCl}$'
      D: '0.20 M $\mathrm{NH_3}$ and 0.0020 M $\mathrm{NH_4Cl}$'
    distractors:
      B: '0.20 M $\mathrm{NaOH}$ and 0.20 M $\mathrm{NH_4Cl}$' # Equal amounts of $\mathrm{NaOH}$ and $\mathrm{NH_4^+}$ react stoichiometrically, converting essentially all $\mathrm{NH_4^+}$ to $\mathrm{NH_3}$ rather than leaving appreciable amounts of both conjugate partners.
      C: '0.20 M $\mathrm{NH_3}$ and 0.20 M $\mathrm{NaCl}$' # $\mathrm{NaCl}$ does not supply the conjugate acid $\mathrm{NH_4^+}$.
      D: '0.20 M $\mathrm{NH_3}$ and 0.0020 M $\mathrm{NH_4Cl}$' # The conjugate pair is present, but the 100:1 concentration ratio is outside the usual effective buffer range and gives strongly unbalanced capacity.
    correct_answer_choice: A
