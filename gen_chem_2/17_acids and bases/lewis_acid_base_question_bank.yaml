title: "Lewis Acid and Base Classification"
date_created: "2026-10-20"
learning_objective: "Define Lewis acids and bases."
author: "Julie Donnelly"
notation: "A Lewis acid accepts an electron pair, whereas a Lewis base donates an electron pair."
question_count: 11
questions:
  - id: LewisAcidBase-01
    question_stem: |-
      Which of the following species can be classified as a Lewis acid?
    choices:
      A: '$\mathrm{NH_3}$'
      B: '$\mathrm{F^-}$'
      C: '$\mathrm{BF_3}$'
      D: '$\mathrm{CH_3OH}$'
    distractors:
      A: '$\mathrm{NH_3}$' # NH3 is a Lewis base because the nitrogen atom can donate a lone pair.
      B: '$\mathrm{F^-}$' # F- is a Lewis base because it can donate a lone pair.
      D: '$\mathrm{CH_3OH}$' # CH3OH is a Lewis base because its oxygen atom can donate a lone pair.
    correct_answer_choice: C
