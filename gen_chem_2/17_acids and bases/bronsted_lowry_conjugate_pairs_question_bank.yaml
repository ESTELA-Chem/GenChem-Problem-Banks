title: "Brønsted-Lowry Conjugate Acid-Base Pairs"
date_created: "2026-10-15"
learning_objective: "Define Brønsted-Lowry acids and bases and identify conjugate acid-base pairs."
author: "Julie Donnelly"
notation: "A Brønsted-Lowry acid donates a proton, and a Brønsted-Lowry base accepts a proton. Members of a conjugate acid-base pair differ by exactly one proton."
question_count: 20
questions:
  - id: ConjugatePair-01
    question_stem: |-
      Consider the Brønsted-Lowry acid-base reaction
      $\mathrm{CH_3COOH(aq) + H_2O(l) \rightleftharpoons H_3O^+(aq) + CH_3COO^-(aq)}$.
      Which two species form a conjugate acid-base pair?
    choices:
      A: '$\mathrm{CH_3COOH}$ and $\mathrm{H_2O}$'
      B: '$\mathrm{CH_3COOH}$ and $\mathrm{CH_3COO^-}$'
      C: '$\mathrm{H_2O}$ and $\mathrm{CH_3COO^-}$'
      D: '$\mathrm{H_3O^+}$ and $\mathrm{CH_3COO^-}$'
    distractors:
      A: '$\mathrm{CH_3COOH}$ and $\mathrm{H_2O}$' # These are the reacting acid and base, but they do not differ by one proton.
      C: '$\mathrm{H_2O}$ and $\mathrm{CH_3COO^-}$' # These species have different molecular frameworks and are not related by one proton.
      D: '$\mathrm{H_3O^+}$ and $\mathrm{CH_3COO^-}$' # These are products, but they are not conjugates of one another.
    correct_answer_choice: B
