title: "Equilibrium Constant Expressions"
date_created: "2026-10-06"
learning_objective: "Express equilibrium constants for chemical reactions."
author: "Julie Donnelly"
notation: "Equilibrium constant expressions use molar concentrations in square brackets. Pure solids and pure liquids are omitted, and stoichiometric coefficients become exponents."
question_count: 7
questions:
  - id: EqConstant-01
    question_stem: |-
      For the equilibrium reaction
      $\mathrm{CaCO_3(s) \rightleftharpoons CaO(s) + CO_2(g)}$,
      which expression represents $K_c$?
    choices:
      A: '$K_c = \dfrac{[\mathrm{CaO}][\mathrm{CO_2}]}{[\mathrm{CaCO_3}]}$'
      B: '$K_c = \dfrac{1}{[\mathrm{CO_2}]}$'
      C: '$K_c = [\mathrm{CO_2}]$'
      D: '$K_c = [\mathrm{CaO}][\mathrm{CO_2}]$'
    distractors:
      A: '$K_c = \dfrac{[\mathrm{CaO}][\mathrm{CO_2}]}{[\mathrm{CaCO_3}]}$' # Incorrectly includes both pure solids.
      B: '$K_c = \dfrac{1}{[\mathrm{CO_2}]}$' # Omits the solids but inverts the equilibrium expression.
      D: '$K_c = [\mathrm{CaO}][\mathrm{CO_2}]$' # Incorrectly includes the solid product CaO(s).
    correct_answer_choice: C

  - id: EqConstant-02
    question_stem: |-
      For the equilibrium reaction
      $\mathrm{NH_4HS(s) \rightleftharpoons NH_3(g) + H_2S(g)}$,
      which expression represents $K_c$?
    choices:
      A: '$K_c = [\mathrm{NH_3}][\mathrm{H_2S}]$'
      B: '$K_c = \dfrac{[\mathrm{NH_3}][\mathrm{H_2S}]}{[\mathrm{NH_4HS}]}$'
      C: '$K_c = \dfrac{1}{[\mathrm{NH_3}][\mathrm{H_2S}]}$'
      D: '$K_c = [\mathrm{NH_3}] + [\mathrm{H_2S}]$'
    distractors:
      B: '$K_c = \dfrac{[\mathrm{NH_3}][\mathrm{H_2S}]}{[\mathrm{NH_4HS}]}$' # Incorrectly includes the pure solid NH4HS(s).
      C: '$K_c = \dfrac{1}{[\mathrm{NH_3}][\mathrm{H_2S}]}$' # Inverts the equilibrium expression.
      D: '$K_c = [\mathrm{NH_3}] + [\mathrm{H_2S}]$' # Adds concentration terms instead of multiplying them.
    correct_answer_choice: A

  - id: EqConstant-03
    question_stem: |-
      For the equilibrium reaction
      $\mathrm{CaF_2(s) \rightleftharpoons Ca^{2+}(aq) + 2F^-(aq)}$,
      which expression represents $K_c$?
    choices:
      A: '$K_c = \dfrac{[\mathrm{Ca^{2+}}][\mathrm{F^-}]^2}{[\mathrm{CaF_2}]}$'
      B: '$K_c = [\mathrm{Ca^{2+}}][\mathrm{F^-}]^2$'
      C: '$K_c = 2[\mathrm{F^-}]$'
      D: '$K_c = \dfrac{1}{[\mathrm{Ca^{2+}}][\mathrm{F^-}]^2}$'
    distractors:
      A: '$K_c = \dfrac{[\mathrm{Ca^{2+}}][\mathrm{F^-}]^2}{[\mathrm{CaF_2}]}$' # Uses the coefficient as an exponent but incorrectly includes the pure solid CaF2(s).
      C: '$K_c = 2[\mathrm{F^-}]$' # Uses the coefficient 2 as a multiplier rather than an exponent and omits Ca2+.
      D: '$K_c = \dfrac{1}{[\mathrm{Ca^{2+}}][\mathrm{F^-}]^2}$' # Uses the coefficient correctly but inverts the equilibrium expression.
    correct_answer_choice: B

  - id: EqConstant-04
    question_stem: |-
      For the equilibrium reaction
      $\mathrm{Fe^{3+}(aq) + 3OH^-(aq) \rightleftharpoons Fe(OH)_3(s)}$,
      which expression represents $K_c$?
    choices:
      A: '$K_c = \dfrac{[\mathrm{Fe(OH)_3}]}{[\mathrm{Fe^{3+}}][\mathrm{OH^-}]^3}$'
      B: '$K_c = \dfrac{1}{3[\mathrm{OH^-}]}$'
      C: '$K_c = [\mathrm{Fe^{3+}}][\mathrm{OH^-}]^3$'
      D: '$K_c = \dfrac{1}{[\mathrm{Fe^{3+}}][\mathrm{OH^-}]^3}$'
    distractors:
      A: '$K_c = \dfrac{[\mathrm{Fe(OH)_3}]}{[\mathrm{Fe^{3+}}][\mathrm{OH^-}]^3}$' # Incorrectly includes the pure solid Fe(OH)3(s).
      B: '$K_c = \dfrac{1}{3[\mathrm{OH^-}]}$' # Uses the coefficient 3 as a multiplier and omits Fe3+.
      C: '$K_c = [\mathrm{Fe^{3+}}][\mathrm{OH^-}]^3$' # Inverts the equilibrium expression.
    correct_answer_choice: D

  - id: EqConstant-05
    question_stem: |-
      For the equilibrium reaction
      $\mathrm{CH_3COOH(aq) + H_2O(l) \rightleftharpoons H_3O^+(aq) + CH_3COO^-(aq)}$,
      which expression represents $K_c$?
    choices:
      A: '$K_c = \dfrac{[\mathrm{H_3O^+}][\mathrm{CH_3COO^-}]}{[\mathrm{CH_3COOH}][\mathrm{H_2O}]}$'
      B: '$K_c = \dfrac{[\mathrm{CH_3COOH}]}{[\mathrm{H_3O^+}][\mathrm{CH_3COO^-}]}$'
      C: '$K_c = \dfrac{[\mathrm{H_3O^+}][\mathrm{CH_3COO^-}]}{[\mathrm{CH_3COOH}]}$'
      D: '$K_c = \dfrac{[\mathrm{H_3O^+}] + [\mathrm{CH_3COO^-}]}{[\mathrm{CH_3COOH}]}$'
    distractors:
      A: '$K_c = \dfrac{[\mathrm{H_3O^+}][\mathrm{CH_3COO^-}]}{[\mathrm{CH_3COOH}][\mathrm{H_2O}]}$' # Incorrectly includes pure liquid water.
      B: '$K_c = \dfrac{[\mathrm{CH_3COOH}]}{[\mathrm{H_3O^+}][\mathrm{CH_3COO^-}]}$' # Omits liquid water but inverts the equilibrium expression.
      D: '$K_c = \dfrac{[\mathrm{H_3O^+}] + [\mathrm{CH_3COO^-}]}{[\mathrm{CH_3COOH}]}$' # Adds the product concentration terms instead of multiplying them.
    correct_answer_choice: C

  - id: EqConstant-06
    question_stem: |-
      For the equilibrium reaction
      $\mathrm{CO_3^{2-}(aq) + H_2O(l) \rightleftharpoons HCO_3^-(aq) + OH^-(aq)}$,
      which expression represents $K_c$?
    choices:
      A: '$K_c = \dfrac{[\mathrm{HCO_3^-}][\mathrm{OH^-}]}{[\mathrm{CO_3^{2-}}]}$'
      B: '$K_c = \dfrac{[\mathrm{CO_3^{2-}}]}{[\mathrm{HCO_3^-}][\mathrm{OH^-}]}$'
      C: '$K_c = \dfrac{[\mathrm{HCO_3^-}][\mathrm{OH^-}]}{[\mathrm{CO_3^{2-}}][\mathrm{H_2O}]}$'
      D: '$K_c = \dfrac{[\mathrm{HCO_3^-}] + [\mathrm{OH^-}]}{[\mathrm{CO_3^{2-}}]}$'
    distractors:
      B: '$K_c = \dfrac{[\mathrm{CO_3^{2-}}]}{[\mathrm{HCO_3^-}][\mathrm{OH^-}]}$' # Omits liquid water but inverts the equilibrium expression.
      C: '$K_c = \dfrac{[\mathrm{HCO_3^-}][\mathrm{OH^-}]}{[\mathrm{CO_3^{2-}}][\mathrm{H_2O}]}$' # Incorrectly includes pure liquid water.
      D: '$K_c = \dfrac{[\mathrm{HCO_3^-}] + [\mathrm{OH^-}]}{[\mathrm{CO_3^{2-}}]}$' # Adds the product concentration terms instead of multiplying them.
    correct_answer_choice: A

  - id: EqConstant-07
    question_stem: |-
      For the equilibrium reaction
      $\mathrm{2H_2O(l) \rightleftharpoons 2H_2(g) + O_2(g)}$,
      which expression represents $K_c$?
    choices:
      A: '$K_c = \dfrac{[\mathrm{H_2}]^2[\mathrm{O_2}]}{[\mathrm{H_2O}]^2}$'
      B: '$K_c = 2[\mathrm{H_2}][\mathrm{O_2}]$'
      C: '$K_c = \dfrac{1}{[\mathrm{H_2}]^2[\mathrm{O_2}]}$'
      D: '$K_c = [\mathrm{H_2}]^2[\mathrm{O_2}]$'
    distractors:
      A: '$K_c = \dfrac{[\mathrm{H_2}]^2[\mathrm{O_2}]}{[\mathrm{H_2O}]^2}$' # Uses the coefficients as exponents but incorrectly includes pure liquid water.
      B: '$K_c = 2[\mathrm{H_2}][\mathrm{O_2}]$' # Omits liquid water but uses the coefficient 2 as a multiplier rather than an exponent.
      C: '$K_c = \dfrac{1}{[\mathrm{H_2}]^2[\mathrm{O_2}]}$' # Omits liquid water and uses the coefficient correctly but inverts the equilibrium expression.
    correct_answer_choice: D
