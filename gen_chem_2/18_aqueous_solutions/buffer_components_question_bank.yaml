      D: '0.20 M $\mathrm{NaHCO_3}$ and 0.0020 M $\mathrm{Na_2CO_3}$' # The conjugate pair is present, but the 100:1 concentration ratio gives strongly unbalanced buffer capacity.
    correct_answer_choice: B
