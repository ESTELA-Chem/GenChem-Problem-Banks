title: "pH Calculations for Weak Acids"
date_created: "2026-10-26"
learning_objective: "Calculate the pH of a weak acid solution."
author: "Julie Donnelly"
notation: "Use the small-$x$ approximation for each weak monoprotic acid or first ionization: $[\\mathrm{H_3O^+}] \\approx \\sqrt{K_aC}$, followed by $\\mathrm{pH} = -\\log[\\mathrm{H_3O^+}]$."
question_count: 15
questions:
  - id: WeakAcidpH-01
    question_stem: |-
      Determine the pH of a 0.150 M aqueous solution of acetic acid, $\mathrm{CH_3COOH}$, with $K_a = 1.8 \times 10^{-5}$.
    choices:
      A: '0.82'
      B: '2.78'
      C: '4.74'
      D: '7.00'
    distractors:
      A: '0.82' # Treats the weak acid as completely ionized and calculates pH directly from the initial acid concentration.
      C: '4.74' # Treats $K_a$ as though it were $[\mathrm{H_3O^+}]$, so the selected value is the acid constant expressed with the p operator rather than the solution pH.
      D: '7.00' # Assumes that a weak acid does not ionize and that the solution remains neutral.
    correct_answer_choice: B
