title: "pH Calculations for Strong Acids"
date_created: "2026-10-26"
learning_objective: "Calculate pH values for strong acids."
author: "Julie Donnelly"
notation: "Strong monoprotic acids are assumed to ionize completely in water, so $[\\mathrm{H_3O^+}]$ equals the initial acid concentration and $\\mathrm{pH} = -\\log[\\mathrm{H_3O^+}]$."
question_count: 15
questions:
  - id: StrongAcidpH-01
    question_stem: |-
      Determine the pH of a 0.150 M aqueous solution of $\mathrm{HBr}$.
    choices:
      A: '1.125'
      B: '0.824'
      C: '0.150'
      D: '1.000'
    distractors:
      A: '1.125' # Assumes $\mathrm{HBr}$ is only 50% ionized, which underestimates $[\mathrm{H_3O^+}]$ and produces a pH that is too high.
      C: '0.150' # Uses the hydronium-ion concentration directly as the pH instead of applying the negative logarithm.
      D: '1.000' # Uses only the exponent in the scientific notation and ignores the coefficient.
    correct_answer_choice: B
