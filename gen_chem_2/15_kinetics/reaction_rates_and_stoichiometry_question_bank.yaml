title: "Reaction Rates and Stoichiometry"
date_created: "2026-10-05"
learning_objective: "Use the stoichiometry of a reaction to relate the rates at which the concentrations of its reactants and products change as the reaction proceeds."
author: "Julie Donnelly"
notation: "Average reaction rate is represented using concentration changes over a finite time interval, Δ[X]/Δt."
question_count: 17
questions:
  - id: RRStoich-01
    question_stem: |-
      For the reaction
      $\mathrm{H_2(g) + I_2(g) \rightarrow 2HI(g)}$,
      which expression represents the average rate of the reaction in terms of the change in concentration of $\mathrm{HI}$ over a time interval?
    choices:
      A: '$\dfrac{\Delta[\mathrm{HI}]}{\Delta t}$'
      B: '$2\dfrac{\Delta[\mathrm{HI}]}{\Delta t}$'
      C: '$-\dfrac{1}{2}\dfrac{\Delta[\mathrm{HI}]}{\Delta t}$'
      D: '$\dfrac{1}{2}\dfrac{\Delta[\mathrm{HI}]}{\Delta t}$'
    distractors:
      A: '$\dfrac{\Delta[\mathrm{HI}]}{\Delta t}$' # Omits division by the stoichiometric coefficient 2.
      B: '$2\dfrac{\Delta[\mathrm{HI}]}{\Delta t}$' # Multiplies by 2 instead of dividing by 2.
      C: '$-\dfrac{1}{2}\dfrac{\Delta[\mathrm{HI}]}{\Delta t}$' # Correctly divides by 2 but incorrectly uses a negative sign for a product.
    correct_answer_choice: D

