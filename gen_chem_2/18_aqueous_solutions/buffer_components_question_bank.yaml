      C: '0.20 M $\mathrm{NaHCO_3}$ and 0.20 M $\mathrm{Na_2SO_4}$'
      D: '0.20 M $\mathrm{NaHCO_3}$ and 0.0020 M $\mathrm{Na_2CO_3}$'
