      B: '0.12 M $\mathrm{HF}$ and 0.12 M $\mathrm{NaF}$'
      C: '0.12 M $\mathrm{HF}$ and 0.12 M $\mathrm{NaCl}$'
      D: '0.0012 M $\mathrm{HF}$ and 0.12 M $\mathrm{NaF}$'
    distractors:
      A: '0.12 M $\mathrm{HCl}$ and 0.12 M $\mathrm{NaF}$' # Equal amounts of $\mathrm{HCl}$ and $\mathrm{F^-}$ react essentially completely to form $\mathrm{HF}$, rather than leave appreciable amounts of both $\mathrm{HF}$ and $\mathrm{F^-}$.
      C: '0.12 M $\mathrm{HF}$ and 0.12 M $\mathrm{NaCl}$' # $\mathrm{Cl^-}$ is not the conjugate base of $\mathrm{HF}$.
      D: '0.0012 M $\mathrm{HF}$ and 0.12 M $\mathrm{NaF}$' # The conjugate pair is present, but the 100:1 concentration ratio gives strongly unbalanced buffer capacity.
    correct_answer_choice: B
