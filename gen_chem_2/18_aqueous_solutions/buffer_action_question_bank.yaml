title: "Buffer Action and Resistance to pH Change"
date_created: "2026-10-26"
learning_objective: "Explain the action of a buffer to resist changes in pH."
author: "Julie Donnelly"
notation: "Added strong base is consumed primarily by the weakly acidic buffer component, while added strong acid is consumed primarily by the weakly basic buffer component. Chemical names and formulas are provided for all species."
question_count: 15
questions:
  - id: BufferAction-01
    question_stem: |-
      A solution contains approximately equal concentrations of acetic acid, $\mathrm{CH_3COOH}$, and sodium acetate, $\mathrm{CH_3COONa}$, in water. Adding a small amount of sodium hydroxide, $\mathrm{NaOH}$, causes the pH to rise only slightly because the hydroxide ions, $\mathrm{OH^-}$, react mainly with the ________ in the buffer.
    choices:
      A: 'Acetic acid, $\mathrm{CH_3COOH}$'
      B: 'Acetate ions, $\mathrm{CH_3COO^-}$'
      C: 'Sodium ions, $\mathrm{Na^+}$'
      D: 'Water, $\mathrm{H_2O}$'
    distractors:
      B: 'Acetate ions, $\mathrm{CH_3COO^-}$' # Acetate ions primarily neutralize added strong acid, not added strong base.
      C: 'Sodium ions, $\mathrm{Na^+}$' # Sodium ions are spectators and do not provide the buffering action.
      D: 'Water, $\mathrm{H_2O}$' # Water is the solvent, not the principal buffer component that consumes the added hydroxide ions.
    correct_answer_choice: A
